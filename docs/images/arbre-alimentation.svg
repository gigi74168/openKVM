<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><rect width="1500" height="560" fill="#ffffff"/><text x="32" y="46" font-size="26" font-weight="700" fill="#1c2430">openKVM v1 - arbre d'alimentation</text><rect x="40" y="110" width="200" height="70" rx="10" fill="#e3f4e1" stroke="#3d9a50" stroke-width="2"/><text x="140.0" y="142.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2430">J1 USB-C CIBLE</text><text x="140.0" y="162.0" text-anchor="middle" font-size="13.5" fill="#5b6675">VBUS 5 V, Rd 5,1 k</text><rect x="40" y="250" width="200" height="70" rx="10" fill="#e3f4e1" stroke="#3d9a50" stroke-width="2"/><text x="140.0" y="282.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2430">J2 USB-C EXT</text><text x="140.0" y="302.0" text-anchor="middle" font-size="13.5" fill="#5b6675">VBUS 5 V, Rd 5,1 k</text><rect x="320" y="110" width="170" height="70" rx="10" fill="#fff3c4" stroke="#c79a00" stroke-width="2"/><text x="405.0" y="142.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2430">U3 LM66100</text><text x="405.0" y="162.0" text-anchor="middle" font-size="13.5" fill="#5b6675">diode ideale</text><rect x="320" y="250" width="170" height="70" rx="10" fill="#fff3c4" stroke="#c79a00" stroke-width="2"/><text x="405.0" y="282.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2430">U4 LM66100</text><text x="405.0" y="302.0" text-anchor="middle" font-size="13.5" fill="#5b6675">diode ideale</text><rect x="570" y="180" width="150" height="70" rx="10" fill="#eef1f5" stroke="#7b8794" stroke-width="2"/><text x="645.0" y="212.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2430">5V_SYS</text><text x="645.0" y="232.0" text-anchor="middle" font-size="13.5" fill="#5b6675">TVS en amont</text><rect x="800" y="90" width="190" height="70" rx="10" fill="#fff3c4" stroke="#c79a00" stroke-width="2"/><text x="895.0" y="122.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2430">U5 TLV62569</text><text x="895.0" y="142.0" text-anchor="middle" font-size="13.5" fill="#5b6675">3,3 V : 100k / 22k</text><rect x="1070" y="90" width="190" height="70" rx="10" fill="#fff3c4" stroke="#c79a00" stroke-width="2"/><text x="1165.0" y="113.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2430">U2 TLV62569</text><text x="1165.0" y="133.0" text-anchor="middle" font-size="13.5" fill="#5b6675">VDD_HP ~1,1 V</text><text x="1165.0" y="150.0" text-anchor="middle" font-size="13.5" fill="#5b6675">EN et FB : P4</text><rect x="1320" y="90" width="150" height="70" rx="10" fill="#dbe8ff" stroke="#2f6fde" stroke-width="2"/><text x="1395.0" y="122.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2430">Coeur P4</text><text x="1395.0" y="142.0" text-anchor="middle" font-size="13.5" fill="#5b6675">VDD_HP_0..3</text><rect x="800" y="215" width="300" height="90" rx="10" fill="#eef1f5" stroke="#7b8794" stroke-width="2"/><text x="950.0" y="239.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2430">Rail 3V3</text><text x="950.0" y="259.0" text-anchor="middle" font-size="13.5" fill="#5b6675">P4 (E/S, LDO, USB PHY)</text><text x="950.0" y="276.0" text-anchor="middle" font-size="13.5" fill="#5b6675">TC358743 (AVDD33, VDDIO)</text><text x="950.0" y="293.0" text-anchor="middle" font-size="13.5" fill="#5b6675">IP101GRI, ecran, microSD, oscillateur</text><rect x="1160" y="215" width="310" height="90" rx="10" fill="#dbe8ff" stroke="#2f6fde" stroke-width="2"/><text x="1315.0" y="239.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2430">LDO internes du P4</text><text x="1315.0" y="259.0" text-anchor="middle" font-size="13.5" fill="#5b6675">VDDO_FLASH 3,3 V  -  VDDO_PSRAM 1,9 V</text><text x="1315.0" y="276.0" text-anchor="middle" font-size="13.5" fill="#5b6675">VDDO_3 2,5 V : MIPI + AVDD25</text><text x="1315.0" y="293.0" text-anchor="middle" font-size="13.5" fill="#5b6675">VDDO_4 3,3 / 1,8 V : E/S microSD</text><rect x="800" y="400" width="190" height="70" rx="10" fill="#fff3c4" stroke="#c79a00" stroke-width="2"/><text x="895.0" y="432.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2430">U6 TLV62569</text><text x="895.0" y="452.0" text-anchor="middle" font-size="13.5" fill="#5b6675">1,2 V : 100k / 100k</text><rect x="1070" y="400" width="400" height="70" rx="10" fill="#ffe6cc" stroke="#d9822b" stroke-width="2"/><text x="1270.0" y="432.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2430">TC358743 : VDDC, VDD_MIPI, AVDD12</text><text x="1270.0" y="452.0" text-anchor="middle" font-size="13.5" fill="#5b6675">via 3 ferrites 600 ohms, ~0,18 A</text><path d="M240,145 L320,145" fill="none" stroke="#7b8794" stroke-width="2.2" marker-end="url(#a)"/><path d="M240,285 L320,285" fill="none" stroke="#7b8794" stroke-width="2.2" marker-end="url(#a)"/><path d="M490,145 L530,145 L530,205 L570,205" fill="none" stroke="#7b8794" stroke-width="2.2" marker-end="url(#a)"/><path d="M490,285 L530,285 L530,228 L570,228" fill="none" stroke="#7b8794" stroke-width="2.2" marker-end="url(#a)"/><path d="M720,205 L760,205 L760,125 L800,125" fill="none" stroke="#7b8794" stroke-width="2.2" marker-end="url(#a)"/><path d="M720,228 L760,228 L760,435 L800,435" fill="none" stroke="#7b8794" stroke-width="2.2" marker-end="url(#a)"/><path d="M990,125 L1070,125" fill="none" stroke="#7b8794" stroke-width="2.2" marker-end="url(#a)"/><text x="1030.0" y="118.0" text-anchor="middle" font-size="13" fill="#1c2430" paint-order="stroke" stroke="#ffffff" stroke-width="4">3V3</text><path d="M1260,125 L1320,125" fill="none" stroke="#7b8794" stroke-width="2.2" marker-end="url(#a)"/><path d="M895,160 L895,215" fill="none" stroke="#7b8794" stroke-width="2.2" marker-end="url(#a)"/><path d="M1100,260 L1160,260" fill="none" stroke="#7b8794" stroke-width="2.2" marker-end="url(#a)"/><path d="M990,435 L1070,435" fill="none" stroke="#7b8794" stroke-width="2.2" marker-end="url(#a)"/><text x="1030.0" y="428.0" text-anchor="middle" font-size="13" fill="#1c2430" paint-order="stroke" stroke="#ffffff" stroke-width="4">1V2</text><text x="40" y="400" font-size="13" fill="#5b6675">Les deux LM66100 ont leur broche CE croisee :</text><text x="40" y="420" font-size="13" fill="#5b6675">la source la plus haute alimente, l'autre est isolee</text><text x="40" y="440" font-size="13" fill="#5b6675">(pas de retour de courant vers la machine cible).</text><text x="40" y="490" font-size="13" fill="#5b6675">Le buck 1,2 V est valide par le 3,3 V : il demarre apres lui.</text></svg>
